<div class="contact">
  <ul class="contact__list list-reset">
    {% if site.data.settings.linkedin %}
      <li><a href="{{ site.data.settings.linkedin }}"><ion-icon name="logo-linkedin"></ion-icon></a></li>
    {% else %} {% endif %}

    {% if site.data.settings.github %}
      <li><a href="{{ site.data.settings.github }}"><ion-icon name="logo-github"></ion-icon></a></li>
    {% else %} {% endif %}

    {% if site.data.settings.email %}
      <li><a href="{{ site.data.settings.email }}"><ion-icon name="mail"></ion-icon></a></li>
    {% else %} {% endif %}
  </ul>
</div>
